[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-training"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.117.1",
  "fitdecode==0.11.0",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.43",
  "uvicorn==0.36.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["tempo*"]
